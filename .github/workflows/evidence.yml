name: Verify archived evidence
on:
  push:
  pull_request:
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'
          cache: pip
          cache-dependency-path: requirements/common.txt
      - run: python -m pip install -r requirements/common.txt
      - run: python scripts/verify_evidence.py
      - run: python -O scripts/verify_evidence.py
      - run: python -m compileall -q scripts pace_repo covid_source
